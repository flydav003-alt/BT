name: 台股K線評分 - 每日更新

on:
  # ── 三個外部 Repo 推送 CSV 時觸發（repository_dispatch）──
  repository_dispatch:
    types:
      - csv-etf-updated     # ETF Repo 推送時發送此事件
      - csv-otc-updated     # 上櫃 Repo 推送時發送此事件
      - csv-tse-updated     # 上市 Repo 推送時發送此事件
      - csv-us-updated      # 美股 Repo 推送時發送此事件

  # ── 手動觸發（可指定類別）──
  workflow_dispatch:
    inputs:
      category:
        description: '處理類別（留空=全部）'
        required: false
        type: choice
        options: ['', 'ETF', 'OTC', 'TSE', 'US']
        default: ''
      mode:
        description: '執行模式'
        required: false
        type: choice
        options: ['normal', 'backfill-only', 'regen-html']
        default: 'normal'

  # ── 每日定時補跑（確保回測資料補齊，台灣時間 18:30）──
  schedule:
    - cron: '30 10 * * 1-5'   # UTC 10:30 = TWN 18:30，週一至週五

# ══════════════════════════════════════════════
# ⚠️ 關鍵：同一時間只允許一個 workflow 執行
#    後來的排隊等待（cancel-in-progress: false）
# ══════════════════════════════════════════════
concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  update:
    name: 更新評分與報告
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 push 到 docs/

    steps:
      # ── 1. Checkout ──
      - name: Checkout 主分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. 判斷觸發類別 ──
      - name: 決定執行類別
        id: resolve
        run: |
          EVENT="${{ github.event_name }}"
          CATEGORY=""
          MODE="normal"

          if [ "$EVENT" = "repository_dispatch" ]; then
            case "${{ github.event.action }}" in
              csv-etf-updated) CATEGORY="ETF" ;;
              csv-otc-updated) CATEGORY="OTC" ;;
              csv-tse-updated) CATEGORY="TSE" ;;
              csv-us-updated)  CATEGORY="US"  ;;
            esac
            echo "觸發來源：repository_dispatch (${{ github.event.action }})"

          elif [ "$EVENT" = "workflow_dispatch" ]; then
            CATEGORY="${{ github.event.inputs.category }}"
            MODE="${{ github.event.inputs.mode }}"
            echo "觸發來源：手動 | 類別=$CATEGORY | 模式=$MODE"

          elif [ "$EVENT" = "schedule" ]; then
            echo "觸發來源：定時排程（補回測）"
            MODE="backfill-only"
          fi

          echo "category=$CATEGORY" >> $GITHUB_OUTPUT
          echo "mode=$MODE"         >> $GITHUB_OUTPUT

      # ── 3. Python 環境 ──
      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: pip install -r requirements.txt yfinance

      # ── 4. 確保資料目錄存在 ──
      - name: 建立必要目錄
        run: |
          mkdir -p data/input data docs/data

      # ── 5. 執行主腳本 ──
      - name: 執行評分與生成
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          cd scripts
          CATEGORY="${{ steps.resolve.outputs.category }}"
          MODE="${{ steps.resolve.outputs.mode }}"

          if [ "$MODE" = "backfill-only" ]; then
            python main.py --backfill-only
          elif [ "$MODE" = "regen-html" ]; then
            python main.py --regen-html
          elif [ -n "$CATEGORY" ]; then
            python main.py --category "$CATEGORY"
          else
            python main.py
          fi

      # ── 6. Commit & Push ──
      - name: 提交更新的靜態檔案
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/history.db
          # 若沒有變動就不提交（避免空 commit）
          if git diff --staged --quiet; then
            echo "無變動，跳過 commit"
          else
            git commit -m "🤖 自動更新 $(date +'%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi
